apiVersion: 1
prune: true

# Recreate on every start so grafana-data does not keep stale derivedFields.
# Increase `version` when derivedFields change, or Grafana ignores the YAML.
deleteDatasources:
  - name: Loki
    orgId: 1
    uid: c73ec8de-9edd-441b-b947-383087fcfc06
  - name: Tempo
    orgId: 1
    uid: tempo
  - name: Prometheus
    orgId: 1
    uid: prometheus

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: c73ec8de-9edd-441b-b947-383087fcfc06
    isDefault: true
    editable: false
    version: 25
    jsonData:
      maxLines: 1000
      # Required for the Trace section / Tempo link in log Details (Grafana logs panel).
      derivedFields:
        - name: traceID
          matcherType: label
          matcherRegex: "^traceID$"
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Open Tempo Trace

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    editable: false
    version: 25
    jsonData:
      tracesToLogsV2:
        datasourceUid: c73ec8de-9edd-441b-b947-383087fcfc06
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{job="backend_logs"} |= "$${__span.traceId}"'
      lokiSearch:
        datasourceUid: c73ec8de-9edd-441b-b947-383087fcfc06
      nodeGraph:
        enabled: true
      search:
        hide: false
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
      streamingEnabled:
        # Dashboard TraceQL table panels use gRPC streaming when true; on this stack
        # streaming often yields empty frames while HTTP Search returns rows.
        # Grafana 12.3+ backend Search() is enough for Explore and dashboards.
        search: false
        metrics: false

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    editable: false
    version: 25
    jsonData:
      timeInterval: 15s
      httpMethod: POST
