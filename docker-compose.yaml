services:
  nginx:
    build:
      context: ./nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/templates:/etc/nginx/templates
      - ./nginx/custom.d:/etc/nginx/custom.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
      - ./nginx/whitelist.conf:/etc/nginx/whitelist.conf
      - ./nginx/logrotate/nginx:/etc/logrotate.d/nginx
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh
    environment:
      - NODE_ENV=development
      - TZ=${TIMEZONE:-UTC}
      - HOSTNAME=${HOSTNAME:-localhost}
      # SSL settings
      - SSL_ENABLE=${SSL_ENABLE:-false}
      - SSL_CERT_FILE=${SSL_CERT_FILE:-cert.pem}
      - SSL_KEY_FILE=${SSL_KEY_FILE:-privkey.pem}
      # Port settings
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
      - BACKEND_PORT=${BACKEND_PORT:-5000}
      - PMA_PORT=${PMA_PORT:-8080}
      - GRAFANA_PORT=${GRAFANA_PORT:-3001}
      - REDIS_INSIGHT_PORT=${REDIS_INSIGHT_PORT:-5540}
      # Redis Insight authentication
      - REDIS_INSIGHT_USER=${REDIS_INSIGHT_USER:-}
      - REDIS_INSIGHT_PASSWORD=${REDIS_INSIGHT_PASSWORD:-}
    entrypoint: ["/docker-entrypoint.sh"]
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
      - "${BACKEND_PORT:-5000}:${BACKEND_PORT:-5000}"
      - "${PMA_PORT:-8080}:${PMA_PORT:-8080}"
      - "${GRAFANA_PORT:-3001}:${GRAFANA_PORT:-3001}"
      - "${REDIS_INSIGHT_PORT:-5540}:${REDIS_INSIGHT_PORT:-5540}"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - frontend-network
      - backend-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
    environment:
      - NODE_ENV=development
      - TZ=${TIMEZONE:-UTC}
      - SITE_URL=${SITE_URL:-http://localhost}
      - VITE_SSL_ENABLE=${SSL_ENABLE:-false}
      - VITE_PROJECT_NAME=${PROJECT_NAME:-docker-fullstack-template}
      - VITE_PROJECT_VERSION=${PROJECT_VERSION:-1.0.0}
      - VITE_PROJECT_DESCRIPTION=${PROJECT_DESCRIPTION:-Docker fullstack template}
      # API settings
      - VITE_API_HOST=${API_HOST:-localhost}
      - VITE_API_PORT=${API_PORT:-5000}
      # SMTP settings
      - VITE_SMTP_ENABLE=${SMTP_ENABLE:-false}
      # Registration settings
      - VITE_REGISTRATION_ENABLE=${REGISTRATION_ENABLE:-true}
    command: ["sh", "./init-dev.sh"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:3000 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    environment:
      - TZ=${TIMEZONE:-UTC}
      - DEBUG_MODE=true
      - RATE_LIMIT_WHITELIST=${RATE_LIMIT_WHITELIST:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_HTTP_BODY=${LOG_HTTP_BODY:-false}
      - LOG_HTTP_BODY_MAX_BYTES=${LOG_HTTP_BODY_MAX_BYTES:-8192}
      - SSL_ENABLE=${SSL_ENABLE:-false}
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - PROJECT_NAME=${PROJECT_NAME:-docker-fullstack-template}
      - PROJECT_VERSION=${PROJECT_VERSION:-0.1.0}
      - PROJECT_DESCRIPTION=${PROJECT_DESCRIPTION:-Docker fullstack template}
      # CORS settings
      - HOSTNAME=${HOSTNAME:-localhost}
      - BACKEND_PORT=${BACKEND_PORT:-5000}
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
      # Database settings
      - DATABASE_URL=mysql+pymysql://${DB_USER:-app}:${DB_PASSWORD:-app}@mariadb/${DB_DATABASE:-app}
      - DATABASE_URL_TEST=mysql+pymysql://${DB_USER:-app}:${DB_PASSWORD:-app}@mariadb/test_${DB_DATABASE:-app}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-3600}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-20}
      - DB_CONNECT_TIMEOUT=${DB_CONNECT_TIMEOUT:-10}
      - DB_READ_TIMEOUT=${DB_READ_TIMEOUT:-30}
      - DB_WRITE_TIMEOUT=${DB_WRITE_TIMEOUT:-30}
      # Redis settings
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis}@redis:6379/0
      # OpenTelemetry settings
      - OTEL_ENABLE=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
      # SMTP settings
      - SMTP_ENABLE=${SMTP_ENABLE:-false}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-your-email@gmail.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-your-password}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-your-email@gmail.com}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Docker Fullstack Template}
      - SMTP_ENCRYPTION=${SMTP_ENCRYPTION:-tls}
      # Email verification settings
      - EMAIL_VERIFICATION_ENABLE=${EMAIL_VERIFICATION_ENABLE:-false}
      # Registration settings
      - REGISTRATION_ENABLE=${REGISTRATION_ENABLE:-true}
    command: ["sh", "./init-dev.sh"]
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      alloy:
        condition: service_started
    networks:
      - backend-network
    restart: always    
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:5000/healthz || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  mariadb:
    image: mariadb:12.3.2
    environment:
      - TZ=${TIMEZONE:-UTC}
      - MYSQL_DATABASE=${DB_DATABASE:-app}
      - MYSQL_USER=${DB_USER:-app}
      - MYSQL_PASSWORD=${DB_PASSWORD:-app}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
      - ./db/custom.cnf:/etc/mysql/conf.d/custom.cnf
      - ./db/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    networks:
      - backend-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin --user=$${MYSQL_USER} --password=$${MYSQL_PASSWORD} --host=localhost ping"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 5
      
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.3
    environment:
      - TZ=${TIMEZONE:-UTC}
      - PMA_HOST=mariadb
      - PMA_USER=root
      - PMA_PASSWORD=${DB_ROOT_PASSWORD:-root}
      - PMA_AUTO_LOGIN=true
    volumes:
      - ./phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - backend-network
    restart: always

  redis:
    image: redis:8.6.4
    environment:
      - TZ=${TIMEZONE:-UTC}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis}
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./redis/docker-entrypoint.sh:/docker-entrypoint.sh
    user: root
    entrypoint: ["/docker-entrypoint.sh"]
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - backend-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis} ping | grep -q PONG"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  redis-insight:
    image: redis/redisinsight:2.70.1
    environment:
      - TZ=${TIMEZONE:-UTC}
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_ALIAS=${PROJECT_NAME:-docker-fullstack-template}
      - RI_REDIS_USERNAME=default
      - RI_REDIS_PASSWORD=${REDIS_PASSWORD:-redis}
    volumes:
      - redis-insight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5540 || exit 1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:3.0.3
    user: root
    command: ["-config.file=/etc/tempo.yaml"]
    environment:
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - tempo-data:/var/tempo
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
    networks:
      - backend-network
    restart: always

  loki:
    image: grafana/loki:3.7.3
    environment:
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - loki-data:/loki
      - loki-wal-data:/wal
      - loki-tsdb-data:/loki/tsdb
      - loki-tsdb-index-data:/loki/tsdb-index
      - loki-tsdb-cache-data:/loki/tsdb-cache
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
    user: root
    command: ["-config.file=/etc/loki/local-config.yaml", "-config.expand-env=true"]
    networks:
      - backend-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  prometheus:
    image: prom/prometheus:v3.14.0
    user: root
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    environment:
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - backend-network
    restart: always

  docker-stats-exporter:
    build:
      context: ./docker-stats-exporter
    user: root
    environment:
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend-network
    restart: always

  # Linux VM / WSL host metrics (not a single container).
  # Host network has no Compose DNS name; Alloy scrapes docker0 at 172.17.0.1:9100.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    pid: host
    network_mode: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/rootfs
      - --no-collector.filesystem
      - --web.listen-address=:9100
    environment:
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/rootfs:ro
    restart: always

  alloy:
    image: grafana/alloy:v1.17.1
    user: root
    environment:
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - alloy-data:/data
      - ./backend/logs:/var/log/backend
      - ./nginx/logs:/var/log/nginx
      - ./alloy:/etc/alloy:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["run", "--storage.path=/data", "/etc/alloy"]
    networks:
      - backend-network
    restart: always
    depends_on:
      - loki
      - tempo
      - prometheus
      - docker-stats-exporter
      - node-exporter

  grafana:
    image: grafana/grafana:12.2.10
    environment:
      - TZ=${TIMEZONE:-UTC}
      - SSL_ENABLE=${SSL_ENABLE:-false}
      - GRAFANA_HOST=${GRAFANA_HOST:-localhost}
      - GRAFANA_PORT=${GRAFANA_PORT:-3001}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=*
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_LOGSINFINITESCROLLING=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/entrypoint.sh"]
    user: root
    depends_on:
      - loki
      - tempo
      - prometheus
    networks:
      - backend-network
      - frontend-network
    restart: always

volumes:
  db-data:
  redis-data:
  redis-insight-data:
  alloy-data:
  prometheus-data:
  tempo-data:
  loki-data:
  loki-wal-data:
  loki-tsdb-data:
  loki-tsdb-index-data:
  loki-tsdb-cache-data:
  grafana-data:

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge