[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for docker-fullstack-template"
requires-python = ">=3.14"
dependencies = [
    "fastapi[all]==0.139.1",
    "uvicorn==0.51.0",
    "gunicorn==26.0.0",
    "asgi-lifespan==2.1.0",
    "sqlalchemy[asyncio]==2.0.51",
    "alembic==1.18.5",
    "uuid-utils==0.17.0",
    "aiomysql==0.3.2",
    "pymysql==1.2.0",
    "python-dotenv==1.2.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-jose==3.5.0",
    "bcrypt==5.0.0",
    "requests==2.34.2",
    "httpx==0.28.1",
    "apscheduler==3.11.3",
    "redis==8.0.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "coverage==7.15.2",
    "pytest-cov==7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-v --tb=short --disable-warnings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore"
]

[tool.coverage.run]
source = ["api", "utils", "extensions"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
    "*/__pycache__/*",
    "*/debug/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
show_missing = true
precision = 2
